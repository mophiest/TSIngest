name: release-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example 0.1.0"
        required: true
        default: "0.1.0"
      platforms:
        description: "Target platforms"
        required: true
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/tsingest" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: platforms
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            platforms="${{ inputs.platforms }}"
          else
            platforms="linux/amd64"
          fi
          cache_scope="$(echo "${platforms}" | tr '/,' '--')"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tsingest-${{ steps.platforms.outputs.cache_scope }}
          cache-to: type=gha,scope=tsingest-${{ steps.platforms.outputs.cache_scope }},mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            GOPROXY=https://proxy.golang.org,direct
            DEBIAN_MIRROR=http://deb.debian.org/debian
            DEBIAN_SECURITY_MIRROR=http://deb.debian.org/debian-security
